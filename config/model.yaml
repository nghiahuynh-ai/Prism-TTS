# PrismTTS model defaults.
# Keep this aligned with config/data.yaml shared layout.

model:
  name: prism_tts

  prism_tts:
    # Number of discrete streams per speech block.
    num_discrete_tokens: 1
    # Must cover codec ids + EOT/EOS/PAD special ids.
    # For discrete_token_count=2048, minimum valid value is 2051.
    discrete_vocab_size: 2051
    continuous_latent_size: 512
    # Standardize real continuous-latent payloads as (x - mean) / std during
    # model training/generation. Generation outputs are converted back to the
    # original latent scale before audio decoding. Keep disabled unless the
    # mean/std values match the training feature distribution.
    normalize_continuous_latents: true
    # Scalars apply to every channel; a 512-value list enables per-channel stats.
    continuous_latent_mean: 0.008161894
    continuous_latent_std: 3.101865141
    continuous_latent_std_eps: 1.0e-6
    flow_num_res_blocks: 4
    flow_model_channels: null
    # Loss weights for shifted autoregressive fused-frame prediction.
    continuous_loss_weight: 1.0
    flow_loss_weight: 1.0
    # Per-token CE weights for discrete stream training:
    # regular = codec IDs, special = EOT/EOS/PAD.
    discrete_regular_token_loss_weight: 1.0
    # EOS is an autoregressive stopping signal and should not be de-emphasized.
    discrete_special_token_loss_weight: 1.0
    flow_sample_steps: 64

  llama_config:
    # Must be >= text_token_offset + num_text_vocab_tokens.
    # With current config/data.yaml + dataset/vocab.txt: 2051 + 304 = 2355.
    vocab_size: 2444
    hidden_size: 1024
    intermediate_size: 4096
    num_hidden_layers: 16
    num_attention_heads: 16
    num_key_value_heads: 16
    max_position_embeddings: 8192
    rope_theta: 10000.0
    rms_norm_eps: 1.0e-6
    initializer_range: 0.02
    pad_token_id: 2050
    eos_token_id: 2049
    use_cache: false
    tie_word_embeddings: false
    # Prefer memory-efficient attention for training stability/performance.
    _attn_implementation: sdpa
