# PrismTTS model defaults.
# Keep this aligned with config/data.yaml shared layout.

model:
  name: prism_tts

  prism_tts:
    # Continuous latent dimension per speech frame (Mimi pre-upsample latent).
    continuous_latent_size: 512
    # Per-frame consistency head (AdaLN MLP).
    flow_num_res_blocks: 4
    flow_model_channels: null
    # Binary end-of-sequence head loss weight.
    eos_loss_weight: 1.0
    # Consistency modeling (sCM / TrigFlow). sigma_data should match the std of
    # the normalized latents (~1.0 after running mean/std normalization).
    sigma_data: 1.0
    # Logit-normal proposal over noise level: t = arctan(exp(N(p_mean, p_std)) / sigma_data).
    p_mean: -1.0
    p_std: 1.6
    # Tangent warmup (ramps the JVP tangent term 0->1 over these steps) + normalization.
    tangent_warmup_steps: 1000
    tangent_norm_const: 0.1
    # CALM short-context branch: a small sliding-window causal transformer over clean
    # local latents; its output is added to the long-context backbone (Z = z_long + z_short).
    use_short_context: true
    short_context_layers: 2
    short_context_window: 10
    # Consistency sampling steps per frame at inference (1 = true 1-step).
    sample_steps: 1
    # EOS stopping probability threshold at inference.
    eos_threshold: 0.5
    # EMA decay for the running latent mean/std normalization statistics.
    latent_stats_decay: 0.999
    # Inject VP-schedule noise into the backbone's context latents during training
    # (exposure-bias regularization; head targets stay clean).
    inject_backbone_noise: true

  llama_config:
    # Must be >= text_token_offset + num_text_vocab_tokens.
    # With current config/data.yaml + dataset/vocab.txt: 2051 + 304 = 2355.
    vocab_size: 2444
    hidden_size: 1024
    intermediate_size: 4096
    num_hidden_layers: 16
    num_attention_heads: 16
    num_key_value_heads: 16
    max_position_embeddings: 8192
    rope_theta: 10000.0
    rms_norm_eps: 1.0e-6
    initializer_range: 0.02
    pad_token_id: 2050
    eos_token_id: 2049
    use_cache: false
    tie_word_embeddings: false
    # Prefer memory-efficient attention for training stability/performance.
    _attn_implementation: sdpa
